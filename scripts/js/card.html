<!doctype html>
<!--
  Card de grafico do Reel (scripts/graphics.py). Pagina sem rede: o driver
  (render_card.mjs) chama window.setup(dados) e depois window.setTime(t) para
  cada quadro. Texto entra so por textContent; nada de HTML montado com texto.
  Movimento calculado em JS a partir do tempo t (sem animacao CSS de relogio).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src file: data:">
<title>Card</title>
<style>
  @font-face { font-family: "Poppins"; font-weight: 800; src: local("Poppins ExtraBold"), local("Poppins-ExtraBold"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: local("Poppins SemiBold"), local("Poppins-SemiBold"); }
  @font-face { font-family: "Poppins"; font-weight: 400; src: local("Poppins Regular"), local("Poppins-Regular"), local("Poppins"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  .card {
    position: absolute; left: 72px; right: 72px; top: var(--top, 320px);
    max-height: var(--max-h, 1260px); overflow: hidden; box-sizing: border-box;
    padding: 56px 60px 60px; border-radius: 28px;
    background: linear-gradient(160deg, var(--glass-hi), var(--glass-lo));
    border: 2px solid var(--edge);
    color: var(--fg); opacity: 0; will-change: opacity, transform;
  }
  .thumb { display: block; width: 280px; height: 280px; object-fit: cover; border-radius: 20px; margin: 0 0 40px; }
  .rule { width: 72px; height: 8px; border-radius: 4px; background: var(--accent); margin: 0 0 32px; }
  .title, .body { margin: 0; overflow-wrap: anywhere; word-break: normal; hyphens: manual; white-space: pre-line; }
  .title { font-family: var(--font-title); font-weight: 800; font-size: 76px; line-height: 1.08; letter-spacing: -0.5px; }
  .body { font-family: var(--font-body); font-weight: 400; font-size: 42px; line-height: 1.36; margin-top: 28px; color: var(--fg-soft); }
</style>
</head>
<body>
<div id="stage"><div class="card" id="card"><div class="rule" aria-hidden="true"></div><h1 class="title" id="title"></h1></div></div>
<script>
'use strict';
(() => {
  let D = null;

  // cubic-bezier(x1,y1,x2,y2) como funcao de progresso (mesma curva do CSS).
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (u) => ((ax * u + bx) * u + cx) * u;
    const sy = (u) => ((ay * u + by) * u + cy) * u;
    const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
    return (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let u = x;
      for (let i = 0; i < 8; i++) {
        const e = sx(u) - x;
        if (Math.abs(e) < 1e-7) break;
        const d = dx(u);
        if (Math.abs(d) < 1e-6) break;
        u -= e / d;
      }
      let lo = 0, hi = 1;
      if (Math.abs(sx(u) - x) > 1e-6) {  // bissecao de reserva
        u = x;
        for (let i = 0; i < 40; i++) { if (sx(u) < x) lo = u; else hi = u; u = (lo + hi) / 2; }
      }
      return sy(u);
    };
  }
  const easeIn = bezier(0.16, 1, 0.3, 1);   // entrada: ease-out suave
  const easeOut = bezier(0.4, 0, 0.2, 1);   // saida: padrao calmo

  function rgb(hex) {
    const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) throw new Error('cor invalida: ' + hex);
    return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
  }
  const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
  const family = (name) => {
    const names = [name, 'Poppins'].filter((n, i, all) => n && all.indexOf(n) === i);
    return names.map((n) => '"' + String(n).replace(/["\\]/g, '') + '"').join(', ') + ', sans-serif';
  };

  window.setup = async (d) => {
    D = d;
    const stage = document.getElementById('stage');
    const card = document.getElementById('card');
    stage.style.transform = `scale(${d.scale})`;
    const root = document.documentElement.style;
    const bg = rgb(d.colors.bg), fg = rgb(d.colors.fg);
    root.setProperty('--fg', d.colors.fg);
    root.setProperty('--fg-soft', rgba(fg, 0.88));
    root.setProperty('--accent', d.colors.accent);
    root.setProperty('--glass-hi', rgba(bg, 0.86));
    root.setProperty('--glass-lo', rgba(bg, 0.93));
    root.setProperty('--edge', rgba(fg, 0.18));
    root.setProperty('--font-title', family(d.fonts.title));
    root.setProperty('--font-body', family(d.fonts.body));
    root.setProperty('--top', d.safe.top + 'px');
    root.setProperty('--max-h', d.safe.maxHeight + 'px');

    for (const f of d.fontFiles || []) {
      try { document.fonts.add(await new FontFace('Poppins', `url("${f.url}")`, { weight: String(f.weight) }).load()); }
      catch (e) { /* fonte local ausente: fica a da maquina */ }
    }

    document.getElementById('title').textContent = d.title;
    if (d.body) {
      const p = document.createElement('p');
      p.className = 'body';
      p.id = 'body';
      p.textContent = d.body;
      card.appendChild(p);
    }
    if (d.image) {
      const img = document.createElement('img');
      img.className = 'thumb';
      img.alt = '';
      img.src = d.image;
      card.insertBefore(img, card.firstChild);
      await img.decode();
    }
    await document.fonts.ready;
    return true;
  };

  // Estado do card no instante t (s). Devolve uma chave: quadros com a mesma
  // chave sao identicos (o driver copia o PNG em vez de tirar outro).
  window.setTime = (t) => {
    const card = document.getElementById('card');
    const end = D.lastFrameTime;
    let op = 1, dy = 0, s = 1;
    if (t < D.enter) {
      const p = easeIn(t / D.enter);
      op = p; dy = (1 - p) * 48; s = 0.985 + 0.015 * p;
    } else if (t > end - D.exit) {
      const q = easeOut(Math.min(1, (t - (end - D.exit)) / D.exit));
      op = 1 - q; dy = -24 * q;
    }
    op = Math.max(0, Math.min(1, op));
    card.style.opacity = op.toFixed(4);
    card.style.transform = `translateY(${dy.toFixed(2)}px) scale(${s.toFixed(4)})`;
    return `${op.toFixed(4)}|${dy.toFixed(2)}|${s.toFixed(4)}`;
  };

  window.inspect = () => {
    const title = document.getElementById('title');
    const body = document.getElementById('body');
    const card = document.getElementById('card');
    const r = card.getBoundingClientRect();
    const k = 1 / D.scale;  // de volta a coordenadas do quadro 1080x1920
    const img = card.querySelector('img');
    return {
      titleFont: getComputedStyle(title).fontFamily,
      titleWeight: getComputedStyle(title).fontWeight,
      bodyFont: body ? getComputedStyle(body).fontFamily : getComputedStyle(title).getPropertyValue('--font-body'),
      bodyWeight: body ? getComputedStyle(body).fontWeight : '400',
      titleText: title.textContent,
      bodyText: body ? body.textContent : null,
      titleScroll: title.scrollWidth, titleClient: title.clientWidth,
      card: { top: r.top * k, bottom: r.bottom * k, left: r.left * k, right: r.right * k },
      imgCount: document.querySelectorAll('img').length,
      imgLoaded: img ? img.complete && img.naturalWidth > 0 : null,
      xss: window.__xss === undefined ? null : window.__xss,
    };
  };
})();
</script>
</body>
</html>
